
<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="index, follow">

  <title>VIDECO</title>
  <link rel="icon" type="image/svg+xml" href="/image/favicon.svg">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #101820;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
      padding: 24px;
    }

    main {
      max-width: 650px;
    }

    h1 {
      font-size: clamp(44px, 9vw, 76px);
      font-weight: 700;
      letter-spacing: 8px;
      margin-bottom: 30px;
    }

    .line {
      width: 55px;
      height: 2px;
      background: #55b6a5;
      margin: 0 auto 30px;
    }

    p {
      font-size: 18px;
      line-height: 1.8;
      color: #b8c1c9;
    }
  </style>
</head>

<body>
  <main>
    <h1>VIDECO</h1>
    <div class="line"></div>
    <p>
      Vi arbetar med vår digitala närvaro.<br>
      Välkommen tillbaka vid ett senare tillfälle.
    </p>
  </main>
</body>
</html>
